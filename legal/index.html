<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ボートレーサー・ストーリーズ 規約・表示｜ボートレーサー・ストーリーズ</title><style>
:root{--bg:#f6f7f3;--card:#fff;--ink:#1f2a1c;--muted:#5f7458;--line:#d8dfd2;--accent:#1f5f8b}
@media (prefers-color-scheme:dark){:root{--bg:#121512;--card:#1c211b;--ink:#e8ede4;--muted:#a6b59e;--line:#334030;--accent:#7cc0ee}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
header a{color:var(--muted);text-decoration:none;font-size:14px}
h1{font-size:24px;line-height:1.4;margin:12px 0 20px}
h2{font-size:18px;margin:28px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
p{margin:8px 0}ul,ol{margin:8px 0;padding-left:1.4em}
a{color:var(--accent);overflow-wrap:anywhere}
dl{margin:16px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:11em 1fr;border-top:1px solid var(--line)}.row:first-child{border-top:0}
dt{padding:12px 14px;font-weight:700;background:color-mix(in srgb,var(--line) 35%,transparent)}
dd{margin:0;padding:12px 14px}dd p:first-child{margin-top:0}dd p:last-child,dd ul:last-child{margin-bottom:0}
@media (max-width:560px){.row{grid-template-columns:1fr}dt{padding-bottom:6px}dd{padding-top:6px}}
nav ul{list-style:none;padding:0}nav li{margin:0;border-top:1px solid var(--line)}nav a{display:block;padding:14px 4px;text-decoration:none}
footer{margin-top:40px;color:var(--muted);font-size:13px}
